<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Fundo arredondado estilo App iOS / Android -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.7" />

  <!-- Silhueta de Edifícios de Luxo ao fundo -->
  <g fill="url(#emeraldGrad)" opacity="0.22">
    <rect x="88" y="150" width="60" height="220" rx="6" />
    <rect x="160" y="100" width="80" height="270" rx="8" />
    <rect x="252" y="130" width="70" height="240" rx="6" />
    <rect x="334" y="170" width="65" height="200" rx="6" />
  </g>

  <!-- Templo / Banco Central Dourado no Topo -->
  <path d="M256 64 L396 134 L116 134 Z" fill="url(#goldGrad)" />
  <rect x="130" y="142" width="252" height="14" rx="4" fill="url(#goldGrad)" />

  <!-- Dados Dourados Estilizados -->
  <g transform="translate(340, 70) rotate(14)">
    <rect x="0" y="0" width="66" height="66" rx="14" fill="url(#goldGrad)" stroke="#020617" stroke-width="4" />
    <circle cx="18" cy="18" r="6" fill="#020617" />
    <circle cx="33" cy="33" r="6" fill="#020617" />
    <circle cx="48" cy="48" r="6" fill="#020617" />
  </g>

  <!-- Escudo Central "BANCO KW" -->
  <rect x="76" y="182" width="360" height="196" rx="32" fill="#020617" fill-opacity="0.82" stroke="url(#goldGrad)" stroke-width="6" />

  <text x="256" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="8" fill="#34d399">
    BANCO
  </text>

  <text x="256" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="112" letter-spacing="4" fill="url(#goldGrad)">
    KW
  </text>

  <!-- Faixa inferior -->
  <rect x="136" y="408" width="240" height="38" rx="19" fill="url(#emeraldGrad)" />
  <text x="256" y="433" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="19" letter-spacing="3" fill="#020617">
    IMOBILIÁRIO
  </text>
</svg>
